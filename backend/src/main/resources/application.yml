server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: trustforge-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:trustforge}
    username: ${DB_USER:trustforge}
    password: ${DB_PASSWORD:trustforge}
    hikari:
      maximum-pool-size: 12
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/trustforge}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      timeout: 800ms
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

trustforge:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-must-be-at-least-32-bytes}
    access-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-days: ${REFRESH_TOKEN_DAYS:7}
  cors:
    allowed-origins: ${CORS_ORIGIN:http://localhost:5173,http://localhost:5174}
  seed-demo: ${SEED_DEMO:true}
