server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
spring:
  application:
    name: trustforge
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/trustforge;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  h2:
    console:
      enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
trustforge:
  jwt-secret: ${JWT_SECRET:trustforge-development-secret-change-me-please-32chars}
  access-token-minutes: ${ACCESS_TOKEN_MINUTES:30}
  refresh-token-days: ${REFRESH_TOKEN_DAYS:7}
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
