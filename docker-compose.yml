services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-trustforge}
      POSTGRES_USER: ${DB_USER:-trustforge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trustforge-local}
    ports:
      - '5433:5432'
    volumes:
      - trustforge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-trustforge}
      DB_USER: ${DB_USER:-trustforge}
      DB_PASSWORD: ${DB_PASSWORD:-trustforge-local}
      JWT_SECRET: ${JWT_SECRET:-trustforge-local-demo-secret-replace-before-deploy}
      CORS_ORIGIN: http://localhost:5174
      SEED_DEMO: 'true'
    ports:
      - '8081:8080'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "curl -fsS http://localhost:8080/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s

  frontend:
    build: ./frontend
    ports:
      - '5174:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  trustforge-postgres:
