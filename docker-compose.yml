services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trustforge
      POSTGRES_USER: trustforge
      POSTGRES_PASSWORD: trustforge
    ports:
      - "5433:5432"
    volumes:
      - "trustforge-postgres:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustforge -d trustforge"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://trustforge:trustforge@postgres:5432/trustforge
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:5174
      JWT_SECRET: local-compose-secret-change-before-production-please
      SEED_DEMO: "true"
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    build: ./frontend
    ports:
      - "5174:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  trustforge-postgres: